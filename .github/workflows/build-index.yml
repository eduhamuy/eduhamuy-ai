name: Build AI Index

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment with configured AI source, evaluation and artifact containers
        required: true
        type: choice
        options: [dev]
      corpus_version:
        description: Immutable corpus version, for example 2026-10-07-v1
        required: true
        type: string
      suite_version:
        description: Immutable evaluation-suite version, for example 2026-10-07-v1
        required: true
        type: string
      build_version:
        description: Optional immutable build identifier; generated when omitted
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build ${{ inputs.environment }} hybrid index
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-indexer.txt

      - name: Authenticate to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install CPU-only indexer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.2.2
          python -m pip install -r requirements-indexer.txt

      - name: Build, evaluate and publish immutable artifacts
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          TARGET_ENV: ${{ inputs.environment }}
          CORPUS_VERSION: ${{ inputs.corpus_version }}
          SUITE_VERSION: ${{ inputs.suite_version }}
          INPUT_BUILD_VERSION: ${{ inputs.build_version }}
        run: |
          BUILD_VERSION="$INPUT_BUILD_VERSION"
          if [ -z "$BUILD_VERSION" ]; then
            BUILD_VERSION="${TARGET_ENV}-${CORPUS_VERSION}-${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}"
          fi
          echo "build_version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
          python -m indexer.build_index build \
            --target-env "$TARGET_ENV" \
            --corpus-version "$CORPUS_VERSION" \
            --suite-version "$SUITE_VERSION" \
            --build-version "$BUILD_VERSION" \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --output-dir "$RUNNER_TEMP/eduhamuy-index" \
            --publish
        id: index

      - name: Summarize build
        env:
          BUILD_VERSION: ${{ steps.index.outputs.build_version }}
        run: |
          echo "## Immutable index build" >> "$GITHUB_STEP_SUMMARY"
          echo "\`builds/hybrid_tfidf_embeddings/$BUILD_VERSION\`" >> "$GITHUB_STEP_SUMMARY"
